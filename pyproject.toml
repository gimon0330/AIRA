[project]
name = "aira"
version = "0.1.0"
description = "Discord bot for checking League of Legends records with Riot API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3.0",
    "aiohttp>=3.9,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
